name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: brandguard_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: brandguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brandguard_owner -d brandguard"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://brandguard_owner:ci-owner-password@localhost:5432/brandguard
      DATABASE_URL: postgresql://brandguard_app:ci-app-password@localhost:5432/brandguard
      APP_DB_PASSWORD: ci-app-password
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      SEED_PASSWORD: ci-seed-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check tracked files for secrets
        run: python -m scripts.check_secrets
      - name: Check Python syntax
        run: python -m compileall -q app tests scripts
      - run: python -m app.migrate
      - run: python -m app.seed
      - name: Backend unit and integration tests
        run: pytest -q
      - name: Run evaluation script (pure functions, no LLM)
        run: python -m scripts.evaluate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript and production build
        run: npm run build
