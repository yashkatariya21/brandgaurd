services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: brandguard_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?set in .env}
      POSTGRES_DB: brandguard
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandguard_owner -d brandguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://brandguard_app:${APP_DB_PASSWORD:?set in .env}@db:5432/brandguard
      MIGRATION_DATABASE_URL: postgresql://brandguard_owner:${OWNER_DB_PASSWORD}@db:5432/brandguard
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    command: sh -c "python -m app.migrate && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  dbdata:
